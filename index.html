<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --ink: #111111;
    --meta: #9a9a9a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 22px 16px 8px;
    text-align: center;
  }

  .wordmark {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    text-indent: 0.3em;
  }

  nav {
    margin-top: 14px;
    display: flex;
    justify-content: center;
    gap: 22px;
  }

  nav button {
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--meta);
    cursor: pointer;
  }

  nav button[aria-pressed="true"] { color: var(--ink); }

  nav button:focus-visible,
  .card:focus-visible { outline: 1px solid var(--ink); outline-offset: 6px; }

  .count {
    position: absolute;
    top: 24px;
    right: 16px;
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--meta);
    text-transform: uppercase;
  }

  main {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    column-gap: 4px;
    row-gap: 46px;
    padding: 34px 10px 90px;
    max-width: 1600px;
    margin: 0 auto;
  }

  @media (min-width: 700px) {
    main {
      grid-template-columns: repeat(4, 1fr);
      row-gap: 64px;
      padding: 48px 28px 120px;
      column-gap: 16px;
    }
    header { padding-top: 34px; }
  }

  @media (min-width: 1100px) {
    main { grid-template-columns: repeat(6, 1fr); }
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: inherit;
  }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
  }

  .stage img,
  .stage video {
    max-width: 82%;
    max-height: 82%;
    width: auto;
    height: auto;
    object-fit: contain;
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.05),
      0 10px 28px rgba(0, 0, 0, 0.10);
    transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.3, 1);
  }

  .stage video {
    position: absolute;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .card:hover .stage img,
  .card:focus-visible .stage img { transform: scale(1.04); }

  .card:hover .stage video,
  .card:focus-visible .stage video { opacity: 1; }

  .empty {
    width: 60%;
    aspect-ratio: 4 / 5;
    border: 1px solid #ededed;
  }

  .label {
    margin-top: 14px;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.5;
  }

  .card[data-live="false"] .label { color: var(--meta); }

  .sub {
    display: none;
    margin-top: 4px;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--meta);
    text-align: center;
  }

  @media (hover: hover) {
    .sub { display: block; opacity: 0; transition: opacity 0.25s ease; }
    .card:hover .sub,
    .card:focus-visible .sub { opacity: 1; }
  }

  .message {
    grid-column: 1 / -1;
    padding: 90px 20px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--meta);
  }

  footer {
    padding: 0 16px 70px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--meta);
  }

  footer a { color: var(--meta); }

  @media (prefers-reduced-motion: reduce) {
    .stage img, .stage video, .sub { transition: none; }
    .card:hover .stage img { transform: none; }
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">Showroom</div>
  <div class="count" id="count"></div>
  <nav role="group" aria-label="Sort">
    <button type="button" data-sort="recent" aria-pressed="true">New</button>
    <button type="button" data-sort="name" aria-pressed="false">A–Z</button>
  </nav>
</header>

<main id="grid">
  <p class="message">Loading</p>
</main>

<footer>
  <a href="https://github.com/jamescamera">github.com/jamescamera</a>
</footer>

<script>
(function () {
  'use strict';

  var SEED = [
    { slug: 'Infinite', name: 'Infinite Camera', note: '', url: 'https://jamescamera.github.io/Infinite/', thumb: '', clip: '', updated: '' },
    { slug: '5.5', name: 'Perfect Breath', note: '', url: 'https://jamescamera.github.io/5.5/', thumb: '', clip: '', updated: '' }
  ];

  var grid = document.getElementById('grid');
  var count = document.getElementById('count');
  var pieces = [];
  var order = 'recent';

  function shortDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var m = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getMonth()];
    return m + ' ' + String(d.getFullYear()).slice(2);
  }

  function sorted() {
    var copy = pieces.slice();
    if (order === 'name') {
      copy.sort(function (a, b) { return a.name.localeCompare(b.name); });
    } else {
      copy.sort(function (a, b) { return new Date(b.updated || 0) - new Date(a.updated || 0); });
    }
    return copy;
  }

  function render() {
    var list = sorted();
    grid.innerHTML = '';

    if (!list.length) {
      grid.innerHTML = '<p class="message">Nothing on the rail</p>';
      count.textContent = '';
      return;
    }

    list.forEach(function (p) {
      var card = document.createElement('a');
      card.className = 'card';
      card.href = p.url || ('https://github.com/jamescamera/' + p.slug);
      card.setAttribute('data-live', p.url ? 'true' : 'false');

      var stage = document.createElement('div');
      stage.className = 'stage';

      if (p.thumb) {
        var img = document.createElement('img');
        img.src = p.thumb;
        img.alt = p.name;
        img.loading = 'lazy';
        stage.appendChild(img);

        if (p.clip) {
          var vid = document.createElement('video');
          vid.src = p.clip;
          vid.muted = true;
          vid.loop = true;
          vid.playsInline = true;
          vid.preload = 'none';
          vid.setAttribute('aria-hidden', 'true');
          stage.appendChild(vid);

          card.addEventListener('mouseenter', function () { vid.play().catch(function () {}); });
          card.addEventListener('focus', function () { vid.play().catch(function () {}); });
          card.addEventListener('mouseleave', function () { vid.pause(); });
          card.addEventListener('blur', function () { vid.pause(); });
        }
      } else {
        var box = document.createElement('div');
        box.className = 'empty';
        stage.appendChild(box);
      }

      var label = document.createElement('div');
      label.className = 'label';
      label.textContent = p.name;

      var sub = document.createElement('div');
      sub.className = 'sub';
      sub.textContent = p.note || shortDate(p.updated);

      card.appendChild(stage);
      card.appendChild(label);
      card.appendChild(sub);
      grid.appendChild(card);
    });

    count.textContent = list.length;
  }

  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (btn) {
    btn.addEventListener('click', function () {
      order = btn.getAttribute('data-sort');
      Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
        b.setAttribute('aria-pressed', String(b === btn));
      });
      render();
    });
  });

  fetch('projects.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('none'); return r.json(); })
    .then(function (data) { pieces = data.projects || []; render(); })
    .catch(function () { pieces = SEED; render(); });
})();
</script>

</body>
</html>
